name: "🤖 Small task for Jules"
description: Maintainer-authored documentation or test fixes dispatched automatically after validation.
title: "[bot] "
labels: ["bot:request"]
body:
  - type: markdown
    attributes:
      value: |
        Only maintainers with current write access can automatically dispatch this form.
        Limit the task to 1–3 named documentation or test files. Runtime, disks, QEMU,
        ARM, security, dependencies and CI permissions require manual ownership.
        Jules must read AGENTS.md, CONTEXT.md and LESSONS.md, preserve assertions,
        run the listed checks, and open a PR labeled jules while actively editing.
        Stop before another writer takes over. No merge, release or unrelated changes.
  - type: dropdown
    id: category
    attributes:
      label: Task category
      options: [Documentation, Tests]
    validations:
      required: true
  - type: textarea
    id: paths
    attributes:
      label: Allowed paths
      description: One exact existing or new file path per line; no globs or directory paths.
      placeholder: tests/example.py
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Requested change
      description: Describe the current behavior, requested change and acceptance criteria.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation command
      description: Include governance-docs-check.py and task-specific checks; never replace evidence with CI success.
      value: python3 scripts/governance-docs-check.py
    validations:
      required: true
  - type: checkboxes
    id: authorization
    attributes:
      label: Authorization
      options:
        - label: I authorize Jules to implement only this scoped task.
          required: true
