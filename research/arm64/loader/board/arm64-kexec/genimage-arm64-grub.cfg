image efi-part.vfat {
  vfat {
    file EFI {
      image = "efi-part/EFI"
    }
    file Image {
      image = "Image"
    }
    file dockdsm-loader.cpio.gz {
      image = "dockdsm-loader.cpio.gz"
    }
  }
  size = 128M
}

image dockdsm-arm64-grub.img {
  hdimage {
    partition-table-type = "gpt"
  }
  partition boot {
    image = "efi-part.vfat"
    partition-type-uuid = U
    offset = 32K
    bootable = true
  }
}
