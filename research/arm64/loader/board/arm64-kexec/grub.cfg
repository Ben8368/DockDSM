set default=0
set timeout=0
serial --port=mmio,0x09000000.l --speed=115200
terminal_input serial
terminal_output serial

menuentry "DockDSM ARM64 kexec research" {
  echo DOCKDSM_ARM64_GRUB_ENTRY
  linux (hd0,gpt1)/Image console=ttyAMA0,115200 earlycon=pl011,0x09000000 rdinit=/init loglevel=7 nokaslr
  initrd (hd0,gpt1)/dockdsm-loader.cpio.gz
}
